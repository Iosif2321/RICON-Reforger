<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">RICON GitHub logo</title>
  <desc id="desc">Compact dark and gold RICON Cellular System icon with radio tower, signal arcs, network nodes, and RICON wordmark.</desc>
  <defs>
    <linearGradient id="ricon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="58%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f260f"/>
    </linearGradient>
    <linearGradient id="ricon-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b87705"/>
    </linearGradient>
    <linearGradient id="ricon-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#556B2F"/>
      <stop offset="48%" stop-color="#d49b18"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>
    <filter id="ricon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="ricon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="ricon-clip">
      <rect x="24" y="24" width="464" height="464" rx="58"/>
    </clipPath>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="58" fill="url(#ricon-bg)" stroke="#d49b18" stroke-width="7" filter="url(#ricon-shadow)"/>

  <g clip-path="url(#ricon-clip)" opacity="0.18">
    <path d="M-20 150H532M-20 226H532M-20 302H532M-20 378H532" stroke="#f8fafc" stroke-width="1.2"/>
    <path d="M102 -20V532M178 -20V532M254 -20V532M330 -20V532M406 -20V532" stroke="#f8fafc" stroke-width="1.2"/>
    <path d="M30 470L470 30M-20 360L360 -20M150 532L532 150" stroke="#d49b18" stroke-width="1" opacity="0.42"/>
  </g>

  <circle cx="256" cy="185" r="146" fill="none" stroke="#d49b18" stroke-width="6" opacity="0.26"/>
  <circle cx="256" cy="185" r="104" fill="none" stroke="#fff0a8" stroke-width="4" opacity="0.20"/>

  <path d="M112 188C149 120 199 86 256 86C313 86 363 120 400 188" fill="none" stroke="#facc15" stroke-width="16" stroke-linecap="round" opacity="0.92"/>
  <path d="M148 235C178 189 214 166 256 166C298 166 334 189 364 235" fill="none" stroke="#fff0a8" stroke-width="10" stroke-linecap="round" opacity="0.70"/>

  <path d="M256 120V313" stroke="#fff0a8" stroke-width="24" stroke-linecap="round"/>
  <path d="M256 142L188 298M256 142L324 298" stroke="#d49b18" stroke-width="18" stroke-linecap="round"/>
  <path d="M205 261H307" stroke="#facc15" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <circle cx="256" cy="112" r="25" fill="url(#ricon-gold)" stroke="#fff7cc" stroke-width="5" filter="url(#ricon-glow)"/>

  <path d="M126 330C167 292 210 274 256 274C302 274 345 292 386 330" fill="none" stroke="url(#ricon-line)" stroke-width="9" stroke-linecap="round" opacity="0.88"/>
  <circle cx="126" cy="330" r="17" fill="#556B2F" stroke="#e7f0d4" stroke-width="5"/>
  <circle cx="256" cy="274" r="17" fill="#d49b18" stroke="#fff0a8" stroke-width="5"/>
  <circle cx="386" cy="330" r="17" fill="#5865F2" stroke="#dbe3ff" stroke-width="5"/>

  <text x="256" y="423" text-anchor="middle" font-family="Arial Black, Impact, 'Segoe UI Black', sans-serif" font-size="62" letter-spacing="4" fill="url(#ricon-gold)" stroke="#0d1117" stroke-width="5" paint-order="stroke">RICON</text>
  <path d="M164 442H348" stroke="#d49b18" stroke-width="5" stroke-linecap="round" opacity="0.62"/>
</svg>
